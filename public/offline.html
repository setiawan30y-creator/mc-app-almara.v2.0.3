<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#047857">
<title>MC Almara — Offline</title>
<style>
html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0f172a;color:#e2e8f0}
body{display:grid;place-items:center;padding:24px}
.card{max-width:520px;width:100%;padding:36px;border:1px solid rgba(255,255,255,.1);border-radius:24px;background:rgba(30,41,59,.9);box-shadow:0 20px 60px rgba(0,0,0,.25);text-align:center}
.logo{width:72px;height:72px;object-fit:contain;margin-bottom:18px}
h1{margin:0 0 10px;font-size:28px}p{color:#94a3b8;line-height:1.7}
button{border:0;border-radius:12px;padding:12px 20px;background:#059669;color:white;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div class="card">
<img class="logo" src="/img/logo-almara.png" alt="Almara">
<h1>Koneksi sedang offline</h1>
<p>MC App Almara membutuhkan koneksi server untuk data transaksi, kurs, stok, nasabah, dan laporan.</p>
<button onclick="location.reload()">Coba Lagi</button>
</div>
</body>
</html>
